# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.
# JVM settings can affect the builds as well.
# Links to understand security better should be explored:
# in http://www.gradle.org/docs/current/userguide/build_environment.html
# http://phauer.com/2016/05/09/gradle-performance/

# The Gradle daemon aims to improve the build server experience by reducing build times and by allowing
# you to keep the server running in the background while you continue working on code in your IDE.
# The following conditions allow for spawning the Gradle daemon:
# 1) the JVM's FirstStart
# 2) the amount of memory consumed by the daemon meets the requirements
# (Gradle 5.1.1 starts the daemon with 512 MB by default)
# They said we should configure per project, which makes sense.
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are being used in your project.
# More info: https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Version of the Gradle
org.gradle.java.home=
